<div class="container" *ngIf="product">

<h2>Modifica Prodotto</h2>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()">

<div class = "mb-3">
    <label for="descrizione">Descrizione</label>
    <input type = "text" formControlName="descrizione" class = "form-control"/>
</div>

<div class = "mb-3">
    <label for="quantita">Quantità</label>
    <input type = "number" formControlName="quantita" class = "form-control"/>
</div>


<div class = "mb-3">
    <label for="descrizione">Prezzo</label>
    <input type = "number" formControlName="prezzo" class = "form-control"/>
</div>

<button type = "submit" class = "btn btn-primary">Aggiorna</button>


</form>

</div>

<div *ngIf="error" class = "alert alert-danger mt-3">
    {{error}} <!-- Interpolazione -->
</div>
